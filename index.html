<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AulaControl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="app-page">
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><span class="brand-mark">AC</span><span>AulaControl</span></div>
            <button class="nav-link nav-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#usersMenu"
                aria-expanded="true">
                Usuarios <span>⌄</span>
            </button>
            <div class="collapse show submenu" id="usersMenu">
                <a class="submenu-link active" href="#captura">Captura</a>
            </div>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <button class="hamburger" id="sidebarToggle" type="button" aria-label="Abrir o cerrar menú"
                    aria-expanded="true"><span></span><span></span><span></span></button>
                <div class="dropdown ms-auto">
                    <button class="user-menu dropdown-toggle" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                        <span id="navbarUser">Usuario</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                        <li><button class="dropdown-item text-danger" id="logoutButton" type="button">Salir del
                                sistema</button></li>
                    </ul>
                </div>
            </header>

            <main class="page-body">
                <h1>Captura</h1>

                <section class="content-card" id="captura">
                    <h2>Usuario</h2>
                    <form id="userForm" novalidate>
                        <div class="row g-3">
                            <div class="col-md-4"><label class="form-label" for="userName">Nombre de
                                    usuario</label><input class="form-control" id="userName" type="text" required>
                                <div class="invalid-feedback">Escribe el nombre.</div>
                            </div>
                            <div class="col-md-4"><label class="form-label" for="userEmail">Correo
                                    electrónico</label><input class="form-control" id="userEmail" type="email" required>
                                <div class="invalid-feedback">Ingresa un correo válido.</div>
                            </div>
                            <div class="col-md-4"><label class="form-label" for="userPassword">Contraseña</label><input
                                    class="form-control" id="userPassword" type="password" required>
                                <div class="invalid-feedback">Mínimo 6 caracteres.</div>
                            </div>
                        </div>
                        <button class="btn btn-primary mt-4" type="submit">Guardar usuario</button>
                    </form>
                </section>

                <section class="content-card">
                    <h2>Alumno</h2>
                    <form id="studentForm" novalidate>
                        <div class="row g-3 align-items-end">
                            <div class="col-md-4"><label class="form-label" for="studentName">Nombre
                                    completo</label><input class="form-control" id="studentName" type="text" required>
                                <div class="invalid-feedback">Escribe el nombre.</div>
                            </div>
                            <div class="col-md-3"><label class="form-label" for="controlNumber">Número de
                                    control</label><input class="form-control" id="controlNumber" type="text"
                                    inputmode="numeric" maxlength="6" required>
                                <div class="invalid-feedback">Debe contener 6 dígitos.</div>
                            </div>
                            <div class="col-md-2"><label class="form-label" for="studentAge">Edad</label><input
                                    class="form-control" id="studentAge" type="number" min="1" max="120" step="1"
                                    required>
                                <div class="invalid-feedback">Ingresa una edad entre 1 y 120 años.</div>
                            </div>
                            <div class="col-md-3"><button class="btn btn-primary w-100" type="submit">Registrar
                                    alumno</button></div>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <div class="modal fade" id="ageModal" tabindex="-1" aria-labelledby="ageModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content age-modal">
                <div class="modal-body text-center p-4">
                    <h2 id="ageModalTitle"></h2>
                    <p id="ageModalMessage" class="text-secondary"></p><button type="button" class="btn btn-primary"
                        data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utileria.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
