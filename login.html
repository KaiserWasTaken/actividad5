<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso | AulaControl</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <!-- identidad del sistema -->
    <section class="login-brand d-none d-lg-flex">
      <div class="brand-content">
        <span class="brand-mark">AC</span>
        <h1>AulaControl</h1>
        <p class="brand-copy">Sistema de gestión académica.</p>
      </div>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <div class="mobile-logo"><span class="brand-mark">AC</span><span>AulaControl</span></div>
        <div class="mb-4"><h2>Iniciar sesión</h2></div>

        <!-- formulario de acceso -->
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="loginEmail" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control form-control-lg" id="loginEmail" placeholder="nombre@ejemplo.com" autocomplete="email" required>
            <div class="invalid-feedback" id="emailError">Ingresa un correo electrónico válido.</div>
          </div>
          <div class="mb-3">
            <label for="loginPassword" class="form-label">Contraseña</label>
            <input type="password" class="form-control form-control-lg" id="loginPassword" placeholder="Mínimo 6 caracteres" autocomplete="current-password" required>
            <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">Entrar al sistema</button>
        </form>
      </div>
    </section>
  </main>
  <script src="js/utileria.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
